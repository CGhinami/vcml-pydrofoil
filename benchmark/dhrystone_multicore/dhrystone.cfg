### Multicore Dhrystone (baremetal) ###########################################
# Every core runs its own instance of Dhrystone from its own ELF, built by
# riscv-tests (multicore_test/dhrystone): benchmarks/dhrystone_core<i>.riscv,
# linked to its own 64K slice of the RAM at 0x800<i>0000. Copy the ELFs to
# ./build/. Any ncores from 1 to 8 works, also from the command line:
#   ./launch.sh benchmark/dhrystone_multicore/dhrystone.cfg -c system.ncores=4

system.name   = dhrystone-multicore
system.config = ${cfg}

system.ncores = 2

system.throttle.rtf = 0
system.quantum      = 1us
system.duration     = 10s

system.clk_cpu.hz   = 1000000000 # 1 GHz
system.clk_clint.hz = 10000000   # 10 MHz

### CPU configuration ########################################################
for i : ${system.ncores} do
system.core${i}.arch_name = "rv64"
system.core${i}.verbose   = false
system.core${i}.trace     = 0
system.core${i}.async     = true

# Pydrofoil intercepts its HTIF tohost/fromhost words before any memory
# access, keep them out of the RAM
system.core${i}.htif_tohost = 0x900F0000

system.core${i}.pc      = 0x800${i}0000
system.core${i}.symbols = ${dir}/build/dhrystone_core${i}.riscv
system.core${i}.elf     = ${dir}/build/dhrystone_core${i}.riscv
done

system.core0.gdb_port = 5555
system.core0.gdb_wait = false

# Loading the ELFs of unused cores is harmless, each has its own RAM slice
system.loader.images = ${dir}/build/dhrystone_core0.riscv \
                       ${dir}/build/dhrystone_core1.riscv \
                       ${dir}/build/dhrystone_core2.riscv \
                       ${dir}/build/dhrystone_core3.riscv \
                       ${dir}/build/dhrystone_core4.riscv \
                       ${dir}/build/dhrystone_core5.riscv \
                       ${dir}/build/dhrystone_core6.riscv \
                       ${dir}/build/dhrystone_core7.riscv

### Memory map ###############################################################
system.ram = 0x80000000..0x8FFFFFFF
system.addr_multicore_simdev = 0x1C203000..0x1C203FFF   # core_done +0x00, sout0 +0x08, sout1 +0x0C

# true: output of core 0 / core 1 goes to logs/core0_output.txt / core1_output.txt
system.multicore_simdev.write_to_file = false

system.term.backends     = stdout
system.term8250.backends = null

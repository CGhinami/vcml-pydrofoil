### General configuration ####################################################
system.name       = Addi example
system.config     = ${cfg}

# Passen Sie diesen Wert an Ihre Build-Einstellung (-DNRCPU) an!
system.ncores = 8

system.throttle.rtf = 0
system.quantum = 1000ns
system.duration = 10000000000s

system.clk_cpu.hz = 1000000000 # 1 GHz

### CPU configuration ########################################################
for i : ${system.ncores} do
system.core${i}.arch_name = "rv32"
system.core${i}.verbose   = false
system.core${i}.trace     = 0

# !! GANZ WICHTIG: Auf 'false' stellen, um den Deadlock zu verhindern !!
system.core${i}.async     = false
system.core${i}.invalidate_all_regs        = true
# system.core${i}.async_rate = 10

system.core${i}.pc        = 0x80000000
system.core${i}.symbols   = ${dir}/build/zephyrW.elf
system.core${i}.elf       = ${dir}/build/zephyrW.elf
done

system.core0.gdb_port = 5555
system.core0.gdb_wait = false

system.loader.images = ${dir}/build/zephyrW.elf
system.term.backends = stdout 

system.ram             = 0x80000000..0x80FFFFFF
system.addr_uart0      = 0x10000000..0x10000FFF
system.addr_plic       = 0x0C000000..0x0C202FFF
system.addr_clint      = 0x04000000..0x0400FFFF
system.addr_multicore_simdev = 0x1C203000..0x1C203FFF
system.addr_simdev = 0x1E203000..0x1E203FFF
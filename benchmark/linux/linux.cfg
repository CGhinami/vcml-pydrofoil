### Buildroot Linux on 1, 2, 4 or 8 harts ####################################
# Based on Pydrofoil-RISCV-benchmarks/sw/linux/files/vp_config/pydrofoil.cfg,
# adapted to the multicore VP (system.ncores harts). The images are built by
# Pydrofoil-RISCV-benchmarks/sw/linux/build_linux.sh into sw/images/buildroot;
# another location can be given with -c images=<dir>. The device tree is
# picked by the hart count: pydrofoil-vp-x<ncores>.dtb, e.g.
#   ./launch.sh benchmark/linux/linux.cfg -c system.ncores=4
#
# The image runs hello_world and then simexit at the end of the boot
# (/etc/init.d/S99hello_world), simexit stops the simulation.

system.name   = pydrofoil-buildroot-linux
system.config = ${cfg}

images = ${dir}/../../../Pydrofoil-RISCV-benchmarks/sw/images/buildroot

system.ncores = 4

system.throttle.rtf = 0

system.quantum    = 100us
system.clk_cpu.hz = 1000000000 # 1 GHz

for i : ${system.ncores} do
system.core${i}.arch_name = "rv64"
system.core${i}.verbose   = false
system.core${i}.trace     = 0
system.core${i}.async     = false

# Pydrofoil intercepts tohost/fromhost before any memory access: outside RAM
system.core${i}.htif_tohost = 0x00003000

# All harts start in OpenSBI: pc = OpenSBI entry, a0 = hart ID,
# a1 = physical address of the DTB. OpenSBI boots Linux on one of them, the
# others wait until Linux starts them (SBI HSM, woken by a CLINT IPI).
system.core${i}.pc = 0x80000000
system.core${i}.a0 = ${i}
system.core${i}.a1 = 0x82200000

system.core${i}.symbols = ${images}/vmlinux.elf
done

### Physical address map #####################################################
# Must agree with sw/linux/files/dt/pydrofoil-vp.dts
system.addr_simdev   = 0x00100000..0x00100fff
system.addr_plic     = 0x0c000000..0x0fffffff
system.addr_uart8250 = 0x10000000..0x10000fff
system.addr_hwrng    = 0x10001000..0x10001fff
system.addr_virtio0  = 0x14000000..0x14000fff

# 512 MiB, matching memory@80000000 in the device tree. system.ram is the
# range while system.sram is the memory module that occupies it.
system.ram = 0x80000000..0x9fffffff

### Interrupt map ############################################################
system.irq_uart8250 = 1
system.irq_virtio0  = 12

### Boot images ##############################################################
# Offsets are relative to the base of the RAM module, i.e. 0x80000000.
system.sram.images = ${images}/opensbi_fw_jump.bin@0x00000000 \
                     ${images}/vmlinux.bin@0x00200000 \
                     ${images}/pydrofoil-vp-x${system.ncores}.dtb@0x02200000

### Peripherals ##############################################################
system.virtio_blk.image    = ${images}/rootfs.ext4
system.virtio_blk.readonly = false

# stdout so the console also works without a terminal (tui needs one)
system.term8250.backends = stdout
system.term.backends     = null
